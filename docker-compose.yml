name: alchemy-bd

services:
  base_datos:
    image: mysql:8.0
    container_name: mysql_alchemy
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_clase
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: alchemy
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - alchemy_datos:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1 -u root
          --password="$$MYSQL_ROOT_PASSWORD" --database=alchemy
          --execute="SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  alchemy_datos:
